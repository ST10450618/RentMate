name: API CI

# Builds and tests the ASP.NET Core API in RentMate.Api/ on every push to any
# branch, and on every PR into main or develop. Like Android CI, there is no
# paths filter, so the latest commit on every branch has a result.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./RentMate.Api

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release, warnings not suppressed)
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: RentMate.Api/**/TestResults/*.trx
          retention-days: 14
          if-no-files-found: ignore
