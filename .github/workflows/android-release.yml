name: Android Release

# Builds the signed release APK and AAB when a release tag is pushed, and
# uploads them (plus the R8 mapping file) as workflow artefacts.
on:
  push:
    tags: ['v*', 'final-poe']
  workflow_dispatch:

permissions:
  # write lets the tag build publish a GitHub Release with the signed APK.
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Name used in artefact names: the tag, or the branch for a manual run.
      RELEASE_NAME: ${{ github.ref_name }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.RENTMATE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RENTMATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RENTMATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RENTMATE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret RENTMATE_${name} is empty or missing. Add it under Settings > Secrets and variables > Actions (see README section 12)."
              missing=1
            fi
          done
          exit $missing

      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RENTMATE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Optional app config. android-ci.yml builds without these (they default
      # to empty); a real release needs them. Written only when set.
      - name: Write local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          : > local.properties
          [ -n "$SUPABASE_URL" ] && echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          [ -n "$SUPABASE_ANON_KEY" ] && echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
          [ -n "$WEB_CLIENT_ID" ] && echo "WEB_CLIENT_ID=$WEB_CLIENT_ID" >> local.properties
          true

      - name: Build signed release APK and AAB
        env:
          RENTMATE_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          RENTMATE_KEYSTORE_PASSWORD: ${{ secrets.RENTMATE_KEYSTORE_PASSWORD }}
          RENTMATE_KEY_ALIAS: ${{ secrets.RENTMATE_KEY_ALIAS }}
          RENTMATE_KEY_PASSWORD: ${{ secrets.RENTMATE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify the APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: rentmate-${{ env.RELEASE_NAME }}-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: rentmate-${{ env.RELEASE_NAME }}-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: error

      - name: Upload R8 mapping file
        uses: actions/upload-artifact@v4
        with:
          name: rentmate-${{ env.RELEASE_NAME }}-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Publish the signed APK and AAB as a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: RentMate ${{ env.RELEASE_NAME }}
          body: Signed production build of RentMate 1.0.0. Install the APK on Android 8.0 or later. See README section 15 for the release notes.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: true

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" local.properties
